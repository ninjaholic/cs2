// ALIASES
echo ":: Loading aliases…"

alias "glhf" "say Commend good plays pls. gl&hf."
alias "gh" "say gh. Commend good plays pls."
alias "gg" "say gg. Commend good plays pls."

alias "cls" "clear;"
alias "dsc" "echo Client disconnect; disconnect;"

alias "+demo_slomo" "demo_timescale 0.4" // Soft limit. Values <0.4 cause stuttering
alias "-demo_slomo" "demo_timescale 1"
alias "+demo_ffw" "demo_timescale 4"
alias "-demo_ffw" "demo_timescale 1"
alias "demo_end" "demo_timescale 99" // lets you skip quickly through the demo

alias "vtog" "voice_modenable_toggle"
alias "voff" "voice_modenable false;echo;echo voice disabled;echo;"
alias "von" "voice_modenable true;echo;echo voice enabled;echo;"

alias rebindalt "bind scancode226 +voicerecord"

// CROSSHAIRS (cl_crosshairstyle 4 only, 2 is dynamic, all others are DISABLED in CS2)
alias xhairbase "cl_crosshairstyle 4;cl_crosshair_dynamic_maxdist_splitratio 1;cl_crosshair_dynamic_splitalpha_innermod 0;cl_crosshair_dynamic_splitalpha_outermod 1;cl_crosshair_dynamic_splitdist 3;cl_crosshair_friendly_warning 0;cl_crosshair_outlinethickness 1;cl_crosshair_sniper_width 3;cl_crosshairgap_useweaponvalue false;cl_crosshairalpha 254;cl_crosshair_t false;cl_fixedcrosshairgap 3.000000;

alias xhairdefgrn "xhairbase;cl_crosshaircolor 5;cl_crosshaircolor_b 0;cl_crosshaircolor_g 255;cl_crosshaircolor_r 0;cl_crosshairusealpha true;"
alias xhairwhite "xhairbase;cl_crosshaircolor 5;cl_crosshaircolor_b 255;cl_crosshaircolor_g 255;cl_crosshaircolor_r 255;cl_crosshairusealpha true;"
alias xhairhotpink "xhairbase;cl_crosshaircolor 5;cl_crosshaircolor_b 180;cl_crosshaircolor_g 105;cl_crosshaircolor_r 255;cl_crosshairusealpha true;"
alias xhairpurple "xhairbase;cl_crosshaircolor 5;cl_crosshaircolor_b 255;cl_crosshaircolor_g 0;cl_crosshaircolor_r 255;cl_crosshairusealpha true;"

alias xhairdefault "xhairdefgrn;cl_crosshairdot false;cl_crosshair_drawoutline true;cl_crosshairsize 5;cl_crosshairthickness 0.6;cl_crosshairgap 0;cl_crosshairusealpha true;cl_crosshaircolor 1;"
alias xhairbiggreen "xhairdefgrn;cl_crosshairdot false;cl_crosshair_drawoutline true;cl_crosshairsize 6;cl_crosshairthickness 0.6;cl_crosshairgap 0;cl_crosshairusealpha true;cl_crosshairalpha 150;"
alias xhairdoughnut "xhairbase;cl_crosshaircolor 0;cl_crosshairdot false;cl_crosshair_drawoutline false;cl_crosshairsize 1;cl_crosshairthickness 2.3;cl_crosshairgap -4;cl_crosshairusealpha true;"

