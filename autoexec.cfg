// ALIASES
echo ":: Loading aliases…"

alias "glhf" "say Commend good plays pls. gl&hf."
alias "gh" "say gh. Commend good plays pls."
alias "gg" "say gg. Commend good plays pls."

alias "cls" "clear;"
alias "dsc" "echo Client disconnect; disconnect;"

alias "+demo_slomo" "demo_timescale 0.4" // Soft limit. Values <0.4 cause stuttering
alias "-demo_slomo" "demo_timescale 1"
alias "+demo_ffw" "demo_timescale 4"
alias "-demo_ffw" "demo_timescale 1"
alias "demo_end" "demo_timescale 99" // lets you skip quickly through the demo

alias "vtog" "voice_modenable_toggle"
alias "voff" "voice_modenable false;echo;echo voice disabled;echo;"
alias "von" "voice_modenable true;echo;echo voice enabled;echo;"

alias rebindalt "bind scancode226 +voicerecord"

